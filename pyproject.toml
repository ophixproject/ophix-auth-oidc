[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-auth-oidc"
version = "2026.04.18.01"
description = "OpenID Connect / Azure AD authentication plugin for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "ophix-server-base",
    "mozilla-django-oidc>=4.0",
]

[project.entry-points."ophix.plugins"]
ophix_auth_oidc = "ophix_auth_oidc"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix_auth_oidc" = [
    "deploy_templates/**/*",
]
