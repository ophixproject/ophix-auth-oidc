[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-auth-oidc"
version = "2026.10.04.01"
description = "OpenID Connect / Azure AD authentication plugin for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "ophix", "oidc", "oauth2", "sso", "azure ad", "authentication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ophix-server-base>=2026.06.08.01",
    "mozilla-django-oidc>=4.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-django"]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/ophix-auth-oidc#readme"
Source = "https://github.com/ophixproject/ophix-auth-oidc"

[project.entry-points."ophix.plugins"]
ophix_auth_oidc = "ophix_auth_oidc"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix_auth_oidc" = [
    "OPHIX_RELEASE_NOTES.md",
    "locale/**/*",
    "deploy_templates/**/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
